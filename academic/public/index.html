<script>
  (function () {
    var key = 'scholay-today.theme';
    var root = document.documentElement;
    var media = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    var button = document.getElementById('theme-toggle');

    function preference() {
      return root.dataset.themePreference || 'system';
    }
    function apply(nextPreference) {
      var dark = nextPreference === 'dark' || (nextPreference === 'system' && media && media.matches);
      root.dataset.theme = dark ? 'dark' : 'light';
      root.dataset.themePreference = nextPreference;
      try { localStorage.setItem(key, nextPreference); } catch (_) {}
      var color = document.querySelector('meta[name="theme-color"]');
      if (color) color.content = dark ? '#111213' : '#f7f5ef';
      if (button) {
        var label = dark ? '深色' : '浅色';
        var nextLabel = dark ? '浅色模式' : '深色模式';
        button.setAttribute('aria-pressed', String(dark));
        button.setAttribute('aria-label', '当前为' + label + '模式，切换为' + nextLabel);
        button.title = '切换为' + nextLabel;
        var glyph = button.querySelector('.theme-toggle-glyph');
        var text = button.querySelector('.theme-toggle-label');
        if (glyph) glyph.textContent = dark ? '☀' : '☾';
        if (text) text.textContent = label;
      }
    }

    apply(preference());
    if (button) button.addEventListener('click', function () {
      apply(root.dataset.theme === 'dark' ? 'light' : 'dark');
    });
    if (media) {
      var followSystem = function () { if (preference() === 'system') apply('system'); };
      if (media.addEventListener) media.addEventListener('change', followSystem);
      else if (media.addListener) media.addListener(followSystem);
    }
  }());
</script>
